{
    "services" : [{
            "name" : "circleos_telemetry_service",
            "path" : ["/system/bin/sa_main", "/system/profile/circleos_telemetry_service.json"],
            "ondemand" : false,
            "uid" : "system",
            "gid" : ["system", "shell"],
            "caps" : ["NET_BIND_SERVICE", "SYS_NICE"],
            "permission" : [
                "ohos.permission.GET_BUNDLE_INFO",
                "ohos.permission.MANAGE_LOCAL_ACCOUNTS"
            ],
            "secon" : "u:r:circleos_telemetry_service:s0"
        }
    ],
    "jobs" : [{
            "name" : "boot",
            "cmds" : ["start circleos_telemetry_service"]
        }
    ]
}
